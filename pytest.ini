[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    edge_case: Edge case tests
    slow: Slow running tests
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=custom_components.unifi_people_pointer
    --cov-report=term-missing
    --cov-report=html
