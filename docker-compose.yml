version: '3.8'

services:
  backend:
    build: ./backend
    container_name: unifi-people-pointer-backend
    ports:
      - "3002:3002"
    volumes:
      - ./data:/data
    environment:
      - PORT=3002
      - DATA_DIR=/data
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: unifi-people-pointer-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
